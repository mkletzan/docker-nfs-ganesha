---
# NFS-Ganesha Kubernetes Deployment Examples
#
# This file contains multiple deployment strategies for Kubernetes:
# 1. Basic Deployment with NodePort
# 2. StatefulSet with Persistent Volume
# 3. DaemonSet for node-local NFS
#
# Choose the one that fits your use case.

###############################################################################
# Example 1: Basic Deployment with NodePort Service
#
# Use case: Simple NFS server with NodePort access
# Best for: Development, testing, single-node clusters
###############################################################################

---
apiVersion: v1
kind: Namespace
metadata:
  name: nfs-ganesha
  labels:
    name: nfs-ganesha

---
# ConfigMap for custom configuration (optional)
apiVersion: v1
kind: ConfigMap
metadata:
  name: nfs-ganesha-config
  namespace: nfs-ganesha
data:
  # Override default environment variables
  EXPORT_PATH: "/data/nfs"
  PROTOCOLS: "4"
  VERBOSITY: "NIV_EVENT"
  SQUASH_MODE: "No_Root_Squash"

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-ganesha
  namespace: nfs-ganesha
  labels:
    app: nfs-ganesha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-ganesha
  template:
    metadata:
      labels:
        app: nfs-ganesha
    spec:
      containers:
      - name: nfs-ganesha
        image: ghcr.io/USER/nfs-ganesha:latest
        imagePullPolicy: Always

        # Minimal capabilities (no privileged mode needed)
        securityContext:
          capabilities:
            add:
            - DAC_OVERRIDE
            - DAC_READ_SEARCH

        # Environment from ConfigMap
        envFrom:
        - configMapRef:
            name: nfs-ganesha-config

        # Ports
        ports:
        - name: nfs
          containerPort: 2049
          protocol: TCP
        - name: rpcbind-tcp
          containerPort: 111
          protocol: TCP
        - name: rpcbind-udp
          containerPort: 111
          protocol: UDP

        # Volume mounts
        volumeMounts:
        - name: nfs-data
          mountPath: /data/nfs

        # Health check
        livenessProbe:
          exec:
            command:
            - showmount
            - -e
            - localhost
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10

        readinessProbe:
          exec:
            command:
            - showmount
            - -e
            - localhost
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5

      # Volumes
      volumes:
      - name: nfs-data
        emptyDir: {}
        # Or use a hostPath for persistent data:
        # hostPath:
        #   path: /mnt/nfs-data
        #   type: DirectoryOrCreate

---
# NodePort Service (accessible from outside cluster)
apiVersion: v1
kind: Service
metadata:
  name: nfs-ganesha
  namespace: nfs-ganesha
  labels:
    app: nfs-ganesha
spec:
  type: NodePort
  selector:
    app: nfs-ganesha
  ports:
  - name: nfs
    port: 2049
    targetPort: 2049
    nodePort: 32049  # Fixed NodePort (optional)
    protocol: TCP
  - name: rpcbind-tcp
    port: 111
    targetPort: 111
    nodePort: 32111  # Fixed NodePort (optional)
    protocol: TCP
  - name: rpcbind-udp
    port: 111
    targetPort: 111
    nodePort: 32111  # Same port as TCP
    protocol: UDP

---
# Usage for NodePort deployment:
#
# 1. Apply:
#    kubectl apply -f kubernetes.yaml
#
# 2. Get node IP:
#    kubectl get nodes -o wide
#
# 3. Mount from client:
#    mount -t nfs4 -o vers=4.1 <node-ip>:/ /mnt/nfs
#    # Port is automatically 32049 (NodePort)
#
# 4. Check status:
#    kubectl -n nfs-ganesha get pods
#    kubectl -n nfs-ganesha logs -f deployment/nfs-ganesha

###############################################################################
# Example 2: StatefulSet with Persistent Volume
#
# Use case: Production NFS server with persistent storage
# Best for: Production environments, data persistence
###############################################################################

---
apiVersion: v1
kind: Service
metadata:
  name: nfs-ganesha-stateful
  namespace: nfs-ganesha
  labels:
    app: nfs-ganesha-stateful
spec:
  type: LoadBalancer  # Or ClusterIP for internal only
  selector:
    app: nfs-ganesha-stateful
  ports:
  - name: nfs
    port: 2049
    targetPort: 2049
    protocol: TCP
  - name: rpcbind-tcp
    port: 111
    targetPort: 111
    protocol: TCP
  - name: rpcbind-udp
    port: 111
    targetPort: 111
    protocol: UDP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nfs-ganesha-stateful
  namespace: nfs-ganesha
spec:
  serviceName: nfs-ganesha-stateful
  replicas: 1
  selector:
    matchLabels:
      app: nfs-ganesha-stateful
  template:
    metadata:
      labels:
        app: nfs-ganesha-stateful
    spec:
      containers:
      - name: nfs-ganesha
        image: ghcr.io/USER/nfs-ganesha:latest
        imagePullPolicy: Always

        securityContext:
          capabilities:
            add:
            - DAC_OVERRIDE
            - DAC_READ_SEARCH

        envFrom:
        - configMapRef:
            name: nfs-ganesha-config

        ports:
        - containerPort: 2049
          name: nfs
        - containerPort: 111
          name: rpcbind

        volumeMounts:
        - name: nfs-data
          mountPath: /data/nfs

        livenessProbe:
          exec:
            command: ["showmount", "-e", "localhost"]
          initialDelaySeconds: 10
          periodSeconds: 30

        readinessProbe:
          exec:
            command: ["showmount", "-e", "localhost"]
          initialDelaySeconds: 5
          periodSeconds: 10

  # Persistent Volume Claim template
  volumeClaimTemplates:
  - metadata:
      name: nfs-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
      # Optional: specify storage class
      # storageClassName: fast-ssd

---
# Usage for StatefulSet:
#
# 1. Apply:
#    kubectl apply -f kubernetes.yaml
#
# 2. Get LoadBalancer IP (if type: LoadBalancer):
#    kubectl -n nfs-ganesha get svc nfs-ganesha-stateful
#
# 3. Mount from client:
#    mount -t nfs4 -o vers=4.1 <loadbalancer-ip>:/ /mnt/nfs
#
# 4. Check persistent volume:
#    kubectl -n nfs-ganesha get pvc

###############################################################################
# Example 3: DaemonSet for Node-Local NFS
#
# Use case: NFS server on every node using local storage
# Best for: kubevirtci, testing environments, node-local storage
###############################################################################

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nfs-ganesha-daemonset
  namespace: nfs-ganesha
  labels:
    app: nfs-ganesha-daemonset
spec:
  selector:
    matchLabels:
      app: nfs-ganesha-daemonset
  template:
    metadata:
      labels:
        app: nfs-ganesha-daemonset
    spec:
      # Host network for easy access from node
      hostNetwork: true

      containers:
      - name: nfs-ganesha
        image: ghcr.io/USER/nfs-ganesha:latest
        imagePullPolicy: Always

        securityContext:
          capabilities:
            add:
            - DAC_OVERRIDE
            - DAC_READ_SEARCH

        envFrom:
        - configMapRef:
            name: nfs-ganesha-config

        ports:
        - containerPort: 2049
          hostPort: 2049
          name: nfs
        - containerPort: 111
          hostPort: 111
          name: rpcbind

        volumeMounts:
        - name: nfs-data
          mountPath: /data/nfs

        livenessProbe:
          exec:
            command: ["showmount", "-e", "localhost"]
          initialDelaySeconds: 10
          periodSeconds: 30

      volumes:
      - name: nfs-data
        hostPath:
          path: /var/lib/nfs-ganesha
          type: DirectoryOrCreate

---
# Usage for DaemonSet:
#
# 1. Apply:
#    kubectl apply -f kubernetes.yaml
#
# 2. NFS runs on each node, accessible via node IP:
#    mount -t nfs4 -o vers=4.1 <node-ip>:/ /mnt/nfs
#
# 3. From within cluster (same node):
#    mount -t nfs4 -o vers=4.1 localhost:/ /mnt/nfs
#
# 4. Check pods:
#    kubectl -n nfs-ganesha get pods -o wide

###############################################################################
# Security Context Example (Restricted)
#
# For clusters with Pod Security Standards (PSS)
###############################################################################

---
apiVersion: v1
kind: Pod
metadata:
  name: nfs-ganesha-restricted
  namespace: nfs-ganesha
  labels:
    app: nfs-ganesha-restricted
spec:
  securityContext:
    # Pod-level security context
    runAsNonRoot: false  # NFS-Ganesha needs root
    runAsUser: 0
    fsGroup: 0
    seccompProfile:
      type: RuntimeDefault

  containers:
  - name: nfs-ganesha
    image: ghcr.io/USER/nfs-ganesha:latest

    securityContext:
      # Container-level security context
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false  # NFS-Ganesha needs writable /var/run
      capabilities:
        drop:
        - ALL
        add:
        - DAC_OVERRIDE
        - DAC_READ_SEARCH

    volumeMounts:
    - name: nfs-data
      mountPath: /data/nfs
    - name: run
      mountPath: /var/run
    - name: tmp
      mountPath: /tmp

  volumes:
  - name: nfs-data
    emptyDir: {}
  - name: run
    emptyDir:
      medium: Memory
  - name: tmp
    emptyDir: {}

---
# Clean up all resources:
#
# kubectl delete namespace nfs-ganesha
#
# Or delete individual resources:
#
# kubectl -n nfs-ganesha delete deployment nfs-ganesha
# kubectl -n nfs-ganesha delete statefulset nfs-ganesha-stateful
# kubectl -n nfs-ganesha delete daemonset nfs-ganesha-daemonset
# kubectl -n nfs-ganesha delete svc --all
# kubectl -n nfs-ganesha delete pvc --all

---
# Notes:
#
# - Replace USER with your GitHub username in image references
# - Adjust storage size in volumeClaimTemplates as needed
# - For production, use specific image tags (not :latest)
# - Configure resource limits/requests based on your workload
# - Consider network policies for security
# - For kubevirtci, DaemonSet with hostPath is typical
