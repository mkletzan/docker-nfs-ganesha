name: Security Scan

on:
  workflow_call:
    inputs:
      image-ref:
        description: 'Docker image reference to scan (e.g., nfs-ganesha:scan or registry/image:tag)'
        required: true
        type: string
      artifact-name:
        description: 'Name for the SBOM artifact'
        required: false
        type: string
        default: 'sbom-spdx'
      severity-cutoff:
        description: 'Minimum severity to report (negligible, low, medium, high, critical)'
        required: false
        type: string
        default: 'medium'
      fail-build:
        description: 'Whether to fail the build on vulnerabilities'
        required: false
        type: boolean
        default: false

jobs:
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/image.tar

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ inputs.image-ref }}
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json

      - name: Scan for vulnerabilities with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: scan
        with:
          image: ${{ inputs.image-ref }}
          fail-build: ${{ inputs.fail-build }}
          severity-cutoff: ${{ inputs.severity-cutoff }}
          output-format: sarif

      - name: Upload vulnerability results to GitHub Security
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3.35.2
        if: always()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.artifact-name }}
          path: sbom.spdx.json
          retention-days: 90
